<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OHC SAP Demo — Red Hat + SAP</title>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300;400;700;900&family=Red+Hat+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #06090F; --surface: #0D1117; --border: #1C2333;
  --text: #F0F4F8; --dim: #8B949E; --muted: #4E5D6C;
  --red: #EE0000; --blue: #0070F2; --green: #00D26A; --amber: #F59E0B;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg); color: var(--text); font-family:'Red Hat Display',sans-serif;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:2rem;
}
.container { max-width:600px; width:100%; text-align:center; }
.brand { display:flex; align-items:center; justify-content:center; gap:1rem; margin-bottom:2rem; }
.rh { color:var(--red); font-size:14px; font-weight:700; letter-spacing:2px; }
.sep { color:var(--muted); font-size:20px; }
.sap { color:var(--blue); font-size:14px; font-weight:700; letter-spacing:2px; }
h1 { font-size:2.5rem; font-weight:900; margin-bottom:1rem; line-height:1.2; }
.subtitle { font-size:1rem; color:var(--dim); font-weight:300; margin-bottom:3rem; }
.status {
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:2rem; margin-bottom:2rem;
}
.spinner {
  width:40px; height:40px; margin:0 auto 1rem;
  border:3px solid var(--border); border-top-color:var(--red);
  border-radius:50%; animation:spin 1s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.status-text { font-family:'Red Hat Mono',monospace; font-size:0.9rem; color:var(--dim); }
.status-dot {
  display:inline-block; width:8px; height:8px; border-radius:50%;
  margin-right:8px; animation:pulse 2s infinite;
}
@keyframes pulse { 0%, 100% { opacity:1; } 50% { opacity:0.4; } }
.dot-green { background:var(--green); }
.dot-amber { background:var(--amber); }
.dot-red { background:var(--red); }
.links { display:flex; flex-direction:column; gap:1rem; margin-top:2rem; }
.link {
  display:block; padding:1rem 2rem; background:var(--surface);
  border:1px solid var(--border); border-radius:8px;
  color:var(--text); text-decoration:none; font-weight:600;
  transition:all 0.2s;
}
.link:hover { border-color:var(--red); transform:translateY(-2px); }
.link-primary { background:var(--red); border-color:var(--red); }
.link-primary:hover { background:#cc0000; }
.footer {
  margin-top:3rem; font-size:0.85rem; color:var(--muted);
  padding-top:2rem; border-top:1px solid var(--border);
}
</style>
</head>
<body>
<div class="container">
  <div class="brand">
    <span class="rh">RED HAT</span>
    <span class="sep">×</span>
    <span class="sap">SAP</span>
  </div>

  <h1>OpenShift Hybrid Cloud Demo</h1>
  <p class="subtitle">Edge-to-Cloud Reference Architecture</p>

  <div class="status" id="status">
    <div class="spinner"></div>
    <div class="status-text">
      <span class="status-dot dot-amber"></span>
      Checking live cluster status...
    </div>
  </div>

  <div class="links" id="links" style="display:none;">
    <!-- Links populated by JavaScript -->
  </div>

  <div class="footer">
    Red Hat OpenShift + SAP Business Technology Platform<br>
    <span style="margin-top:0.5rem; display:inline-block;">February 2026</span>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// CONFIG: Update this when cluster URL changes
// ═══════════════════════════════════════════════════════════
const LIVE_CLUSTER_URL = 'https://north-qr-demo-qa.apps.rosa.rosa-rvdtn.ypet.p3.openshiftapps.com';
// ═══════════════════════════════════════════════════════════

const HEALTH_CHECK_TIMEOUT = 3000; // 3 seconds

async function checkCluster() {
  const statusEl = document.getElementById('status');
  const linksEl = document.getElementById('links');

  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), HEALTH_CHECK_TIMEOUT);

    const response = await fetch(`${LIVE_CLUSTER_URL}/healthz`, {
      signal: controller.signal,
      mode: 'cors'
    });

    clearTimeout(timeoutId);

    if (response.ok) {
      // Live cluster is UP - redirect
      statusEl.innerHTML = `
        <div class="status-text">
          <span class="status-dot dot-green"></span>
          Live cluster online — redirecting...
        </div>
      `;
      setTimeout(() => {
        window.location.href = LIVE_CLUSTER_URL;
      }, 1000);
    } else {
      throw new Error('Health check failed');
    }
  } catch (error) {
    // Cluster is DOWN - show static fallback
    statusEl.innerHTML = `
      <div class="status-text">
        <span class="status-dot dot-amber"></span>
        Live cluster offline — static demo available
      </div>
    `;

    linksEl.style.display = 'flex';
    linksEl.innerHTML = `
      <a href="static.html" class="link link-primary">📊 View Static Demo</a>
      <a href="mercedes-dashboard.html" class="link">🚗 Mercedes Telemetry</a>
      <a href="mercedes-live-route.html" class="link">🗺️ Mercedes Route Map</a>
      <a href="mercedes-integration.html" class="link">📄 Mercedes Integration Info</a>
      <a href="${LIVE_CLUSTER_URL}" class="link" target="_blank">🔄 Try Live Cluster Anyway</a>
    `;
  }
}

// Run check on load
checkCluster();
</script>
</body>
</html>
